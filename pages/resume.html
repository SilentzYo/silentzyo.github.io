    <hr>

    <main class="resume">
        <p class="resume-hint" id="resume-hint">
            Drag the paper to rotate<br>
            <span class="hint-mouse">Scroll to zoom</span><span class="hint-touch">Pinch to zoom</span>
        </p>
        <div class="resume-stage" id="resume-stage"></div>
        <script>
            if (location.protocol === 'file:') {
                document.getElementById('resume-hint').hidden = true;
                var stage = document.getElementById('resume-stage');
                stage.classList.add('is-flat');
                stage.innerHTML = '<p class="resume-error">Could not be loaded</p>';
            }
        </script>
    </main>

    <footer>
